name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22: @tailwindcss/oxide exige >= 20 y astro >= 22. Con Node 18 el
      # paso de build falla y el deploy queda saltado, que es lo que venia
      # pasando en silencio desde que entro Tailwind v4.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Deploy to Hostinger via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/home/u427298056/domains/planesprepagas.com.ar/public_html/'
          sftp_only: true

      # El paso de arriba sube `./dist/*`, y ese glob NO incluye archivos
      # ocultos: sin este segundo paso el .htaccess nunca llega al servidor y
      # el sitio sigue respondiendo 200 en www y sin www a la vez.
      - name: Deploy .htaccess (el glob de arriba omite los ocultos)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './dist/.htaccess'
          remote_path: '/home/u427298056/domains/planesprepagas.com.ar/public_html/'
          sftp_only: true
