name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix sitio-broker-salud

      - name: Build site
        run: npm run build --prefix sitio-broker-salud

      - name: Deploy to Hostinger via SFTP
        uses: pressworks/github-action-ftp-deployment@master
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          local-dir: ./sitio-broker-salud/dist/
          remote-dir: ./public_html/sitio-broker-salud/dist/
