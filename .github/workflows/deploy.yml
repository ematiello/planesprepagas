name: Build & Validate

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build fallido: no se genero dist/"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Build incompleto: falta dist/index.html"
            exit 1
          fi
          echo "Build validado ✓"
          echo "Proximos pasos: deploy manual via MCP desde Claude Code."
